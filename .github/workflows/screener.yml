name: Saham Premarket Screener Bot

on:
  schedule:
    # Running 1: Jam 08:30 WIB (Premarket)
    - cron: '30 1 * * 1-6'
    # Running 2: Jam 12:15 WIB (Break Session Siang)
    - cron: '15 5 * * 1-6'
  workflow_dispatch: # Tombol run manual di GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
        run: python bot.py

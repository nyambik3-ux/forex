name: Saham Premarket Screener Automation

on:
  schedule:
    # 01:30 UTC = 08:30 WIB | Berjalan Senin - Jumat (1-5)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: # Agar bisa di-run manual kapan saja

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
        run: python bot.py

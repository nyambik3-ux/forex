name: Saham Weekly Position Screener Bot

on:
  schedule:
    # Running tiap hari Sabtu jam 08:00 WIB (Selesai penutupan bursa mingguan)
    - cron: '0 1 * * 6'
  workflow_dispatch: # Tombol manual jika ingin run kapan saja

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
        run: python bot.py
